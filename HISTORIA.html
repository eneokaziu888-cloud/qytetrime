window.fa=x=>{window.fp=(window.fp||[]);window.fp.push(x);fe()};
V.g5=()=>{window.fp=null;const L=[['Karli i Madh u kurorëzua në Romë në vitin 800.','Fakt'],['Aleksandri i Madh themeloi Aleksandrinë.','Fakt'],['Konstandinopoja ra në 1453 para Mehmetit II.','Fakt'],['Shpata e Karlit "Joyeuse" ishte e pathyeshme.','Legjendë'],['Muhamedi ishte kalif i parë i Bagdadit.','Gabim']];const q=L[Math.floor(Math.random()*L.length)];window.hq=q;return`<h1>🔍 Fakt, legjendë apo gabim?</h1><div class="card"><h3>${q[0]}</h3>${['Fakt','Legjendë','Gabim'].map(o=>`<button class="opt" onclick="hc('${o}')">${o}</button>`).join('')}<div id="r"></div></div>`};
window.hc=o=>{const ok=o==window.hq[1];if(ok)xp(5);$('#r').innerHTML=`<div class="fb">${ok?'✅ Saktë! +5 XP':'❌ Është: '+window.hq[1]}<br>Historiani shqyrton burimet: fakti vërtetohet, legjenda përcillet pa prova.</div><button class="btn" onclick="go('g5')">Tjetri</button>`};
V.daily=()=>{const d=new Date().toDateString(),n=dayN()%Q.length;return`<h1>Sfida e ditës</h1><p class="mu">Pyetja ndryshon sipas datës lokale (grup pyetjesh i përgatitur paraprakisht).</p>${S.daily==d?'<div class="card">✔ E përfunduar sot. Kthehu nesër!</div>':''}<div id="dq"></div><h2>Sfida javore</h2><button class="btn" onclick="wk()">Fillo (10 pyetje)</button><div id="wq"></div>`};
window.wk=()=>quiz(sh(Q).slice(0,10),$('#wq'),()=>{},'weekly');
V.gloss=()=>`<h1>Fjalori historik</h1><input id="gs" placeholder="Kërko term…" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg2)"><div id="gl"></div>`;
function gl(f){$('#gl').innerHTML=[...GL].sort((a,b)=>a[0].localeCompare(b[0],'sq')).filter(g=>g[0].toLowerCase().includes(f.toLowerCase())).map(g=>`<div class="card"><b>${g[0]}</b> <span class="tag">${TN[g[3]]}</span><br>${g[1]}<br><i class="mu">Shembull: ${g[2]}</i></div>`).join('')||'<p>Asnjë rezultat.</p>'}
V.cmp=()=>{const k=Object.keys(CP);const sel=n=>`<select id="${n}">${k.map(x=>`<option value="${x}">${CP[x][0]}</option>`).join('')}</select>`;return`<h1>Krahasimi i qytetërimeve</h1><div class="row">${sel('c1')} kundrejt ${sel('c2')}</div><div class="wrap" id="ct"></div><p class="mu">Krahasimet janë të përgjithshme dhe të thjeshtuara.</p>`};
function cc(){const a=CP[$('#c1').value],b=CP[$('#c2').value];$('#ct').innerHTML=`<table><tr><th></th><th>${a[0]}</th><th>${b[0]}</th></tr>${CR.map((r,i)=>`<tr><th>${r}</th><td>${a[1][i]}</td><td>${b[1][i]}</td></tr>`).join('')}</table>`}
V.final=()=>`<h1>Testi final</h1><p>${Q.length} pyetje nga të gjitha temat. Vlerësim orientues, jo notë zyrtare.</p><button class="btn" id="fs">Fillo testin</button><div id="ft"></div>`;
V.prof=()=>{const l=lvl();return`<h1>Profili</h1><div class="grid"><div class="card"><b>${LV[l]}</b><br>⭐ ${S.xp} XP</div><div class="card">Temat: ${S.done.length}/${T.length}</div><div class="card">Koha: ${Math.round(S.sec/60)} min</div><div class="card">Rezultati më i mirë: ${Math.max(0,...Object.values(S.best))}%</div></div><h2>Distinktivët</h2>${Object.entries(BD).map(([k,v])=>`<span class="tag" style="padding:8px 12px;opacity:${S.badges.includes(k)?1:.35}">🏅 ${v}</span>`).join('')}<p><button class="btn s" onclick="if(confirm('Të fshihet progresi?')){S=Object.assign({},D0,{done:[],best:{},badges:[],g:{}});save();hud();go('prof')}">Rifillo progresin</button></p>`};
V.search=q=>{q=q.toLowerCase().replace(/[<>&"']/g,'');const r=[...T.filter(t=>(t.t+t.intro).toLowerCase().includes(q)).map(t=>['Temë',t.t,"go('topic','"+t.id+"')"]),...GL.filter(g=>(g[0]+g[1]).toLowerCase().includes(q)).map(g=>['Term',g[0]+' — '+g[1],"go('gloss')"]),...EV.filter(e=>e[1].toLowerCase().includes(q)).map(e=>['Ngjarje',fy(e[0])+' '+e[1],"go('time')"]),...PE.filter(p=>p[0].toLowerCase().includes(q)).map(p=>['Personazh',p[0],"go('games')"]),...CITY.filter(c=>c[0].toLowerCase().includes(q)).map(c=>['Qytet',c[0],"go('map')"])];return`<h1>Rezultatet për “${q}”</h1>${r.map(x=>`<div class="card h" onclick="${x[2]}"><span class="tag">${x[0]}</span> ${x[1]}</div>`).join('')||'<p>Nuk u gjet asgjë.</p>'}`};
function go(v,p){app.innerHTML=(V[v]||V.home)(p);app.classList.remove('fade');void app.offsetWidth;app.classList.add('fade');window.scrollTo(0,0);
document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v||(v=='topic'&&b.dataset.v=='topics')));
if(v=='home')rf();
if(v=='topic'){const t=T.find(x=>x.id==p)||T[0];quiz(Q.filter(x=>x.tp==t.id),$('#qz'),null,t.id);$('#dn').onclick=()=>{if(!S.done.includes(t.id)){S.done.push(t.id);xp(30);const b={e:'feud',b:'byz',a:'islam'}[t.id];if(b)badge(b);save()}$('#dn').textContent='✔ E përfunduar'}}
if(v=='g1')ro();if(v=='g2')wi();if(v=='g3')fe();
if(v=='gloss'){gl('');$('#gs').oninput=e=>gl(e.target.value)}
if(v=='cmp'){$('#c2').value='b';cc();$('#c1').onchange=$('#c2').onchange=cc}
if(v=='final')$('#fs').onclick=()=>quiz(sh(Q),$('#ft'),()=>{},'final');
if(v=='daily'&&S.daily!=new Date().toDateString()){const q=Q[dayN()%Q.length];quiz([q],$('#dq'),()=>{S.daily=new Date().toDateString();xp(10);save()})}
}
window.go=go;
$('#nav').innerHTML=NAVS.map(n=>`<button data-v="${n[0]}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');
$('#q').onkeydown=e=>{if(e.key=='Enter'&&e.target.value.trim())go('search',e.target.value.trim())};
$('#th').onclick=()=>{const r=document.documentElement;r.dataset.theme=(r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches))?'light':'dark'};
$('#rm').onclick=()=>document.body.classList.toggle('reduce');
if(matchMedia('(prefers-reduced-motion:reduce)').matches)document.body.classList.add('reduce');
hud();go('home');</script>
</body></html>
